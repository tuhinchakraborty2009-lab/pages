<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{20.page_title}}</title>
<meta name="description" content="{{20.meta_desc}}" />
<meta property="og:title" content="{{20.page_title}}" />
<meta property="og:description" content="{{20.meta_desc}}" />
<meta property="og:image" content="https://funnelmint.org/wp-content/uploads/2025/10/Real-Estate-5.png" />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700&family=Source+Sans+3:wght@400;500&family=Work+Sans:wght@600&display=swap" rel="stylesheet" />
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<style>
:root{
  --primary:#3ED6B8;--accent:#FF6B6B;--bg:#F9FAFB;--text:#1F2933;
  --subtext:#6B7280;--highlight:#FBBF24;--neutral:#E5E7EB
}
body{margin:0;font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);scroll-behavior:smooth;}
/* Preloader */
#preloader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;z-index:9999}
#preloader div{width:40px;height:40px;border:4px solid var(--primary);border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Hero */
.hero{position:relative;height:80vh;background:url('https://funnelmint.org/wp-content/uploads/2025/10/Real-Estate-5.png')center/cover no-repeat;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff}
.hero::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.45)}
.hero-content{position:relative;z-index:2;padding:0 1rem}
.hero h1{font-family:'Rubik',sans-serif;font-size:2.4rem;margin:0;text-shadow:0 3px 8px rgba(0,0,0,0.5)}
.hero p{font-size:1.1rem;margin-top:1rem;color:#f0f0f0}
.btn{background:var(--accent);color:#fff;padding:14px 26px;border:none;border-radius:6px;font-family:'Work Sans',sans-serif;font-weight:600;font-size:1rem;cursor:pointer;transition:background .3s}
.btn:hover{background:#ff5151}
/* Sticky CTA */
.sticky-cta{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:12px 20px;border-radius:50px;font-family:'Work Sans',sans-serif;font-weight:600;box-shadow:0 3px 10px rgba(0,0,0,0.3);cursor:pointer;z-index:999}
/* Section */
.section{max-width:900px;margin:60px auto;background:#fff;padding:40px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.05)}
.section h2{font-family:'Rubik',sans-serif;color:var(--primary);border-left:4px solid var(--accent);padding-left:12px}
ul.benefits{list-style:disc;margin-left:25px}
.benefits li{margin-bottom:8px}
/* Form */
form{display:flex;flex-direction:column;gap:14px;max-width:480px;margin:auto}
input,select,button{padding:12px;border:1px solid var(--neutral);border-radius:6px;font-size:1rem}
button[type=submit]{background:var(--primary);color:#fff;font-weight:600;cursor:pointer;border:none}
button[type=submit]:hover{background:#2cb39a}
.alert{margin-top:10px;padding:10px;border-radius:6px;display:none;text-align:center}
.alert.error{background:#ffeaea;color:#c00}
.alert.success{background:#eaffea;color:#060}
/* Footer */
.footer{text-align:center;color:var(--subtext);font-size:.9rem;padding:20px 0;border-top:1px solid var(--neutral)}
</style>
</head>
<body>
<div id="preloader"><div></div></div>
<div class="hero">
  <div class="hero-content">
    <h1>{{20.headline}}</h1>
    <p>{{20.subhead}}</p>
    <button class="btn" onclick="document.querySelector('#leadForm').scrollIntoView({behavior:'smooth'})">{{20.cta_text}}</button>
  </div>
</div>
<div class="sticky-cta" onclick="document.querySelector('#leadForm').scrollIntoView({behavior:'smooth'})">{{20.cta_text}}</div>

<div class="section">
  <h2>Key Benefits</h2>
  <ul class="benefits">
    <li>{{87.Benefits}}</li>
  
  </ul>
</div>

<div class="section">
  <h2>Market Insights</h2>
  <div>{{87.`Market Insights`}}</div>
</div>

<div class="section" id="form-section">
  <h2>Get in Touch</h2>
  <p>{{resource_outline}}</p>
  <form id="leadForm" action="#" method="POST">
    <input type="hidden" name="client_id" id="client_id">
    <input type="text" name="name" placeholder="Full Name" required>
    <input type="email" name="email" placeholder="Email Address" required>
    <input type="tel" name="phone" placeholder="Phone Number" required>
    <label>I consent to be contacted:</label>
    <select name="consent" required><option value="">Select</option><option>Yes</option><option>No</option></select>
    <div class="g-recaptcha" data-sitekey="6LflCOorAAAAAObIcprWup0PUyW2ZLwABg2Hpk7J"></div>
    <button type="submit">Submit</button>
    <div class="alert error" id="errorMsg">Spam detected or invalid email.</div>
    <div class="alert success" id="successMsg">Thank you! Your message has been received.</div>
  </form>
</div>

<div class="section"><h2>FAQ</h2><div>{{87.Faq}}</div></div>
<div class="footer">{{20.legal}}</div>

<script>
// Preloader
window.addEventListener('load',()=>{document.getElementById('preloader').style.display='none'});

// Slug Detection
const path=location.pathname.split('/');const slugIndex=path.indexOf('clients');if(slugIndex!==-1)document.getElementById('client_id').value=path[slugIndex+1];

const form=document.getElementById('leadForm');
form.addEventListener('submit',async(e)=>{
  e.preventDefault();
  const errorMsg=document.getElementById('errorMsg');
  const successMsg=document.getElementById('successMsg');
  errorMsg.style.display=successMsg.style.display='none';
  const fd=new FormData(form);
  // CleanTalk check
  const payload={method_name:"check_message",auth_key:"9upatenu4ugu4eh",message:fd.get('name')+" "+fd.get('email')+" "+fd.get('phone')};
  const res=await fetch('https://api.cleantalk.org/',{method:'POST',body:new URLSearchParams(payload)});
  const data=await res.json();
  if(data.data.allow==0){errorMsg.style.display='block';return;}
  // Send to Make
  await fetch("https://hook.eu2.make.com/tj6x1jczn3fk8fv3v4zxpum2757maau6",{method:"POST",body:fd});
  successMsg.style.display='block';
  // Intent logic (example variable injected by Make)
  if('{{5.intent}}'==='Provide a free resource with lead generation'){window.open('{{37.download_url}}','_blank');}
});
</script>
</body>
</html>
